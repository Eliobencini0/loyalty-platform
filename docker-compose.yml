# Local development — Postgres only.
# The app and frontends run on the host (npm run dev), not in Docker.
# Start the DB:  docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: loyalty_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: loyalty
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: loyalty_platform
    ports:
      - "5432:5432"
    volumes:
      - loyalty_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loyalty -d loyalty_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  loyalty_pgdata:
